<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>Éire Daily — News &amp; Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dash" id="fit">

    <!-- ===== Top bar: clock / date / brand / last-updated ===== -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 62" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harp">
          <defs>
            <linearGradient id="harpGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f3da90"/>
              <stop offset="0.5" stop-color="#d8a44a"/>
              <stop offset="1" stop-color="#b67e2f"/>
            </linearGradient>
          </defs>
          <!-- strings -->
          <g stroke="#f4e7c0" stroke-width="0.85" opacity="0.9">
            <line x1="19" y1="8.5"  x2="19" y2="53"/>
            <line x1="23" y1="9"    x2="23" y2="50.5"/>
            <line x1="27" y1="10.5" x2="27" y2="47.5"/>
            <line x1="31" y1="13"   x2="31" y2="43"/>
            <line x1="35" y1="16"   x2="35" y2="37.5"/>
            <line x1="38" y1="20"   x2="38" y2="31"/>
          </g>
          <!-- soundboard (right body edge) -->
          <path d="M16 56 Q41 44 40 22" fill="none" stroke="url(#harpGold)" stroke-width="3.9" stroke-linecap="round"/>
          <!-- pillar (left column) -->
          <path d="M14 8 C 7 24 8 42 16 56" fill="none" stroke="url(#harpGold)" stroke-width="3.4" stroke-linecap="round"/>
          <!-- neck (top harmonic curve) -->
          <path d="M14 8 Q 30 5 40 22" fill="none" stroke="url(#harpGold)" stroke-width="3.4" stroke-linecap="round"/>
          <!-- crown knob -->
          <circle cx="14" cy="8" r="2.7" fill="url(#harpGold)"/>
        </svg>
        <span class="brand-name">Éire&nbsp;Daily</span>
        <span class="brand-sub">News &amp; Weather</span>
      </div>
      <div class="clock">
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate">&nbsp;</div>
      </div>
    </header>

    <!-- ===== Main row: hero news card + side column ===== -->
    <main class="stage">

      <!-- Hero rotating card -->
      <section class="hero" id="hero" aria-live="polite">
        <div class="hero-progress"><span class="hero-progress-fill" id="heroFill"></span></div>

        <div class="hero-media" id="heroMedia">
          <div class="hero-media-img" id="heroImg"></div>
          <div class="hero-media-scrim"></div>
          <div class="hero-media-fallback" id="heroFallback">
            <span class="fallback-glyph" id="fallbackGlyph"></span>
            <span class="fallback-label">No image</span>
          </div>
        </div>

        <div class="hero-body">
          <div class="hero-meta">
            <span class="badge" id="heroBadge">Source</span>
            <span class="hero-time" id="heroTime">just now</span>
          </div>
          <h1 class="hero-title" id="heroTitle">Loading headlines…</h1>
          <p class="hero-summary" id="heroSummary"></p>
          <div class="hero-dots" id="heroDots"></div>
        </div>
      </section>

      <!-- Side column: up next -->
      <aside class="side">
        <div class="side-head">
          <span class="side-title">Up Next</span>
          <span class="side-count" id="sideCount"></span>
        </div>
        <ul class="upnext" id="upnext"></ul>
      </aside>
    </main>

    <!-- ===== Bottom strip: Dublin weather ===== -->
    <footer class="strip">
      <div class="strip-card weather" id="weatherCard">

        <!-- current conditions -->
        <div class="weather-main">
          <div class="weather-icon" id="weatherIcon"><span class="weather-icon-cloud"></span></div>
          <div class="weather-now">
            <div class="weather-place">
              <span class="weather-city">Dublin</span>
              <span class="weather-updated">
                <span class="weather-updated-dot"></span>Updated <span id="updatedTime">—</span>
              </span>
            </div>
            <div class="weather-templine">
              <span class="weather-temp" id="weatherTemp">--&deg;</span>
              <span class="weather-cond" id="weatherCond">&mdash;</span>
            </div>
          </div>
        </div>

        <!-- now stats -->
        <div class="weather-stats">
          <div class="wx-stat"><span class="wx-k">Rain</span><span class="wx-v" id="weatherRain">--%</span></div>
          <div class="wx-stat"><span class="wx-k">Precip</span><span class="wx-v" id="weatherPrecip">-- mm</span></div>
          <div class="wx-stat"><span class="wx-k">Wind</span><span class="wx-v" id="weatherWind">-- km/h</span></div>
        </div>

        <!-- today / tomorrow mini forecast -->
        <div class="weather-forecast">
          <div class="wx-day">
            <span class="wx-day-name">Today</span>
            <span class="wx-day-temp" id="fcTodayTemp">--&deg; / --&deg;</span>
            <span class="wx-day-rain" id="fcTodayRain">--%</span>
          </div>
          <div class="wx-day">
            <span class="wx-day-name">Tomorrow</span>
            <span class="wx-day-temp" id="fcTomorrowTemp">--&deg; / --&deg;</span>
            <span class="wx-day-rain" id="fcTomorrowRain">--%</span>
          </div>
        </div>

      </div>
    </footer>

    <!-- Test Audio: temporary button for proof-of-audio test -->
    <button id="testAudioBtn" style="position: fixed; top: 12px; right: 12px; z-index: 9999; padding: 8px 12px; font-size: 12px; background: #d8a44a; color: #0b110f; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Test Audio</button>
    <audio id="testAudio" preload="none">
      <source src="assets/audio/bird.mp3" type="audio/mpeg">
    </audio>
  </div>
  <script src="app.js"></script>
</body>
</html>
